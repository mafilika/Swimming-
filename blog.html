<!-- ================= BLOG LIST PAGE (blog.html) ================= --><!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog | R&R Swimming Pools</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
</head>
<body><header class="header">
  <div class="logo">R&R Swimming Pools & Projects</div>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="gallery.html">Gallery</a>
    <a href="blog.html">Blog</a>
    <a href="contact.html" class="btn-nav">Contact</a>
  </nav>
</header><section class="hero">
  <div class="overlay"></div>
  <div class="hero-content">
    <h1>Pool Insights & Transformations</h1>
  </div>
</section><section class="section">
  <h2 class="section-title">Latest Articles</h2>
  <div id="blogPosts" class="grid"></div>
</section><script>
const SPACE_ID = "YOUR_SPACE_ID";
const ACCESS_TOKEN = "YOUR_ACCESS_TOKEN";
const CONTENT_TYPE = "blogPost";

const url = `https://cdn.contentful.com/spaces/${SPACE_ID}/entries?access_token=${ACCESS_TOKEN}&content_type=${CONTENT_TYPE}&include=2`;

async function fetchPosts() {
  const res = await fetch(url);
  const data = await res.json();

  const container = document.getElementById("blogPosts");

  const assets = {};
  data.includes?.Asset?.forEach(asset => {
    assets[asset.sys.id] = asset.fields.file.url;
  });

  data.items.forEach(post => {
    const id = post.sys.id;
    const title = post.fields.title;
    const imageId = post.fields.featuredImage?.sys.id;
    const imageUrl = imageId ? `https:${assets[imageId]}` : "";

    const div = document.createElement("div");
    div.className = "service-card";

    div.innerHTML = `
      <img src="${imageUrl}" style="width:100%;height:200px;object-fit:cover;border-radius:6px;">
      <h3 style="margin-top:10px">${title}</h3>
      <a href="blog-post.html?id=${id}" class="btn-primary">Read More</a>
    `;

    container.appendChild(div);
  });
}

fetchPosts();
</script></body>
</html><!-- ================= SINGLE BLOG PAGE (blog-post.html) ================= --><!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Post</title>
<link rel="stylesheet" href="style.css">
</head>
<body><header class="header">
  <div class="logo">R&R Swimming Pools</div>
</header><section class="section" id="postContainer">
  <h1>Loading...</h1>
</section><script>
const params = new URLSearchParams(window.location.search);
const postId = params.get("id");

const SPACE = "YOUR_SPACE_ID";
const TOKEN = "YOUR_ACCESS_TOKEN";

async function fetchPost() {
  const res = await fetch(`https://cdn.contentful.com/spaces/${SPACE}/entries/${postId}?access_token=${TOKEN}&include=2`);
  const data = await res.json();

  const container = document.getElementById("postContainer");

  const title = data.fields.title;
  const content = data.fields.content;

  container.innerHTML = `
    <h1 style="font-size:36px;margin-bottom:20px">${title}</h1>
    <div style="max-width:800px;line-height:1.6">${content}</div>
    <a href="contact.html" class="btn-primary">Get a Quote</a>
  `;
}

fetchPost();
</script></body>
</html>
