<head>

<link rel="stylesheet" href="assets/css/style.css">

<body>
  <header class="header">
  <div class="logo">R&R Swimming Pools & Projects</div>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="gallery.html">Gallery</a>
    <a href="blog.html">Blog</a>
    <a href="contact.html" class="btn-nav">Contact</a>

</header>
  <section class="hero">
  <div class="overlay"></div>
  <div class="hero-content">
    <h1>Pool Insights & Transformations</h1>
  </div>
</section><section class="section">
  <h2 class="section-title">Latest Articles</h2>
  <div id="blogPosts" class="grid"></div>
</section><script>
const SPACE_ID = "0w1hbdkrnr1w";
const ACCESS_TOKEN = "_eV2RjSSBWbBJaRHWhGg2wG3gVy3atzdXQTlGYdvk4w";
const CONTENT_TYPE = "blogPost";

const url = `https://cdn.contentful.com/spaces/${SPACE_ID}/entries?access_token=${ACCESS_TOKEN}&content_type=${CONTENT_TYPE}&include=2`;

async function fetchPosts() {
  const res = await fetch(url);
  const data = await res.json();

  const container = document.getElementById("blogPosts");

  const assets = {};
  data.includes?.Asset?.forEach(asset => {
    assets[asset.sys.id] = asset.fields.file.url;
  });

  data.items.forEach(post => {
    const id = post.sys.id;
    const title = post.fields.title;
    const imageId = post.fields.featuredImage?.sys.id;
    const imageUrl = imageId ? `https:${assets[imageId]}` : "";

    const div = document.createElement("div");
    div.className = "service-card";

    div.innerHTML = `
      <img src="${imageUrl}" style="width:100%;height:200px;object-fit:cover;border-radius:6px;">
      <h3 style="margin-top:10px">${title}</h3>
      <a href="blog-post.html?id=${id}" class="btn-primary">Read More</a>
    `;

    container.appendChild(div);
  });
}

fetchPosts();
</script></body>
</html><!-- ================= SINGLE BLOG PAGE (blog-post.html) ================= --><!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Post</title>

</head>
<body>
  <section class="section" id="postContainer">
  <h1>Loading...</h1>
</section><script>
const params = new URLSearchParams(window.location.search);
const postId = params.get("id");

const SPACE = "0w1hbdkrnr1w";
const TOKEN = "_eV2RjSSBWbBJaRHWhGg2wG3gVy3atzdXQTlGYdvk4w";

async function fetchPost() {
  const res = await fetch(`https://cdn.contentful.com/spaces/${SPACE}/entries/${postId}?access_token=${TOKEN}&include=2`);
  const data = await res.json();

  const container = document.getElementById("postContainer");

  const title = data.fields.title;
  const content = data.fields.content;

  container.innerHTML = `
    <h1 style="font-size:36px;margin-bottom:20px">${title}</h1>
    <div style="max-width:800px;line-height:1.6">${content}</div>
    <a href="contact.html" class="btn-primary">Get a Quote</a>
  `;
}

fetchPost();
<style>
#chatbot-btn {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: #0a2540;
  color: #fff;
  padding: 16px;
  border-radius: 50%;
  cursor: pointer;
  z-index: 999;
}

#chatbot-box {
  position: fixed;
  bottom: 80px;
  right: 20px;
  width: 340px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  display: none;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#chatbot-header {
  background: #0a2540;
  color: #fff;
  padding: 14px;
  font-weight: bold;
}

#chatbot-body {
  padding: 15px;
  font-size: 14px;
  min-height: 120px;
}

.typing {
  font-style: italic;
  color: #888;
}

.chat-option {
  display: block;
  background: #f1f1f1;
  margin-top: 10px;
  padding: 10px;
  border-radius: 6px;
  cursor: pointer;
}

.chat-option:hover {
  background: #0a2540;
  color: #fff;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
}
</style>

<div id="chatbot-btn">👷🏽‍♂️</div>

<div id="chatbot-box">
  <div id="chatbot-header">R&R Pools Assistant</div>
  <div id="chatbot-body"></div>
</div>

<script>
const phone = "27720207880";

let userData = {
  name: "",
  area: "",
  service: ""
};

document.getElementById("chatbot-btn").onclick = () => {
  const box = document.getElementById("chatbot-box");
  box.style.display = box.style.display === "none" ? "block" : "none";
  startChat();
};

function typing(message, callback) {
  const body = document.getElementById("chatbot-body");
  body.innerHTML = "<p class='typing'>Typing...</p>";
  
  setTimeout(() => {
    body.innerHTML = "<p>" + message + "</p>";
    if (callback) callback();
  }, 1200);
}

function startChat() {
  typing("Hi 👋 Looking to build or upgrade your pool?", () => {
    document.getElementById("chatbot-body").innerHTML += `
      <div class="chat-option" onclick="selectService('New Pool')">Build New Pool</div>
      <div class="chat-option" onclick="selectService('Renovation')">Renovate Pool</div>
    `;
  });
}

function selectService(service) {
  userData.service = service;
  
  typing("Great choice 👍 What's your name?", () => {
    document.getElementById("chatbot-body").innerHTML += `
      <input type="text" id="nameInput" placeholder="Enter your name">
      <div class="chat-option" onclick="saveName()">Continue</div>
    `;
  });
}

function saveName() {
  const name = document.getElementById("nameInput").value;
  if (!name) return alert("Please enter your name");
  
  userData.name = name;

  typing("Nice to meet you " + name + " 👋 Which area are you based in?", () => {
    document.getElementById("chatbot-body").innerHTML += `
      <input type="text" id="areaInput" placeholder="Your area">
      <div class="chat-option" onclick="saveArea()">Continue</div>
    `;
  });
}

function saveArea() {
  const area = document.getElementById("areaInput").value;
  if (!area) return alert("Please enter your area");

  userData.area = area;

  typing(
    "We currently have ONLY 2 free consultation slots today.\n\nConsultation Fee: R570\n\nAnd Our GUARANTEE: If we don’t finish your project on time, you don’t pay anything.",
    () => {
      document.getElementById("chatbot-body").innerHTML += `
        <div class="chat-option" onclick="goWhatsApp()">Secure My Slot</div>
      `;
    }
  );
}

function goWhatsApp() {
  let message = encodeURIComponent(
    "Hi, my name is " + userData.name +
    ". I'm in " + userData.area +
    ". I want a " + userData.service +
    ". I want to secure one of the 2 consultation slots and understand its Free From R570 fee and guarantee."
  );

  window.open(`https://wa.me/${phone}?text=${message}`, "_blank");
}

    let hasOpened = false;

// AUTO POPUP AFTER 4 SECONDS
setTimeout(() => {
  if (!hasOpened) {
    openChatbot();
  }
}, 4000);

// OPEN FUNCTION
function openChatbot() {
  const box = document.getElementById("chatbot-box");
  box.style.display = "block";
  hasOpened = true;

  interruptMessage();
}

// SHAKE EFFECT
function shakeButton() {
  const btn = document.getElementById("chatbot-btn");
  btn.style.transition = "0.1s";
  
  let i = 0;
  let interval = setInterval(() => {
    btn.style.transform = `translateX(${i % 2 === 0 ? 5 : -5}px)`;
    i++;
    if (i > 6) {
      clearInterval(interval);
      btn.style.transform = "translateX(0)";
    }
  }, 100);
}

// INTERRUPT MESSAGE (HIGH CONVERSION)
function interruptMessage() {
  const body = document.getElementById("chatbot-body");

  body.innerHTML = `
    <p><b>⚠️ Before you leave...</b></p>

    <p>We currently have <b>ONLY 2 FREE consultation slots</b> available this week before We are Fully booked in Cape Town.</p>

    <p style="color:red;"><b>And Our Guarantee:</b> If we don’t finish your pool project on time, you don’t pay anything.</p>

    <p>Consultation Fee: <b>R570</b></p>

    <p>Do you want to secure your slot now?</p>

    <div class="chat-option" onclick="startChat()">Yes, show me options</div>
    <div class="chat-option" onclick="closeChat()">No, I’ll come back later</div>
  `;
}

// CLOSE CHAT
function closeChat() {
  document.getElementById("chatbot-box").style.display = "none";
}


</script>
</body>
</html>
